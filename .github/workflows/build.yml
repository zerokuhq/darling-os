name: Build DarlingOS Image

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      darling_tag:
        description: 'Darling release tag to package'
        required: false
        default: 'v0.1.20260608'
        type: string
      img_size:
        description: 'Raw disk image size (e.g. 8G, 10G)'
        required: false
        default: '8G'
        type: string
      build_from_source:
        description: 'Compile Darling directly from source instead of prebuilt packages'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Build & Release DarlingOS Image (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build tools and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap \
            qemu-utils \
            qemu-system-arm \
            qemu-efi-aarch64 \
            parted \
            dosfstools \
            e2fsprogs \
            zstd \
            curl \
            unzip \
            kpartx \
            ca-certificates \
            grub-efi-arm64-bin

      - name: Build DarlingOS disk image
        run: |
          sudo env "PATH=$PATH" \
            "TARGET_ARCH=arm64" \
            "DARLING_TAG=${{ inputs.darling_tag || 'v0.1.20260608' }}" \
            "IMG_SIZE=${{ inputs.img_size || '8G' }}" \
            "BUILD_DARLING_FROM_SOURCE=${{ inputs.build_from_source && '1' || '0' }}" \
            ./scripts/build-image.sh
          sudo chmod -R a+rX build/dist

      - name: Headless QEMU boot smoke test
        run: |
          echo "Starting QEMU ARM64 headless boot smoke test..."
          timeout --preserve-status 40s qemu-system-aarch64 \
            -M virt -cpu cortex-a57 -m 2G -smp 2 \
            -bios /usr/share/qemu-efi-aarch64/QEMU_EFI.fd \
            -drive file=build/dist/darlingos-arm64.qcow2,format=qcow2,if=virtio \
            -nographic -serial file:boot.log || true
          
          echo "=== Console Boot Output ==="
          if [ -f boot.log ]; then
            tr -cd '\11\12\15\40-\176' < boot.log | head -n 60
          else
            echo "No boot log generated"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: darlingos-arm64
          path: |
            build/dist/darlingos-arm64.qcow2.zst
            build/dist/darlingos-arm64.qcow2.zst.sha256
            build/dist/darlingos-arm64.qcow2.sha256
            build/dist/IMAGE-INFO.txt
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: "DarlingOS ${{ github.ref_name }} (ARM64)"
          body_path: build/dist/IMAGE-INFO.txt
          draft: false
          prerelease: false
          files: |
            build/dist/darlingos-arm64.qcow2.zst
            build/dist/darlingos-arm64.qcow2.zst.sha256
            build/dist/IMAGE-INFO.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
